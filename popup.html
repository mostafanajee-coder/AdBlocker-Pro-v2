<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { width: 280px; padding: 16px; background: #f8f9fa; }
    h1 { font-size: 16px; font-weight: 700; margin-bottom: 12px; color: #1a73e8; }
    .toggle-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #e8eaed; }
    .toggle-row:last-of-type { border-bottom: none; }
    .toggle-label { font-size: 13px; color: #202124; }
    .toggle { position: relative; width: 36px; height: 20px; cursor: pointer; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; inset: 0; background: #ccc; border-radius: 20px; transition: 0.2s; }
    .slider::before { content: ""; position: absolute; left: 2px; bottom: 2px; width: 16px; height: 16px; background: #fff; border-radius: 50%; transition: 0.2s; }
    .toggle input:checked + .slider { background: #1a73e8; }
    .toggle input:checked + .slider::before { transform: translateX(16px); }
    .whitelist-btn { width: 100%; margin-top: 12px; padding: 8px; border: 1px solid #dadce0; border-radius: 6px; background: #fff; color: #202124; font-size: 13px; cursor: pointer; text-align: center; }
    .whitelist-btn:hover { background: #f1f3f4; }
    .whitelist-btn.active { background: #e8f0fe; color: #1a73e8; border-color: #1a73e8; }
    .status { margin-top: 10px; font-size: 11px; color: #5f6368; text-align: center; }
    .sep { border: none; border-top: 1px solid #e8eaed; margin: 8px 0; }
    .section-title { margin: 14px 0 4px; font-size: 11px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; color: #1a73e8; border-bottom: 2px solid #1a73e8; padding-bottom: 4px; }
    .counter { margin-top: 12px; padding: 8px; border-radius: 6px; background: #e8f0fe; color: #1a73e8; font-size: 13px; font-weight: 700; text-align: center; }
    .filter-box { padding: 8px 0 4px; }
    .filter-stat { font-size: 11px; color: #5f6368; text-align: center; line-height: 1.5; }
    .filter-stat b { color: #1a73e8; }
  </style>
</head>
<body>
  <h1>Ad Blocker Pro</h1>

  <div class="toggle-row">
    <span class="toggle-label">Ad Blocker</span>
    <label class="toggle">
      <input type="checkbox" id="adBlock">
      <span class="slider"></span>
    </label>
  </div>

  <div class="toggle-row">
    <span class="toggle-label">Strict Tracking</span>
    <label class="toggle">
      <input type="checkbox" id="strictTracking">
      <span class="slider"></span>
    </label>
  </div>

  <div class="toggle-row">
    <span class="toggle-label">Anti-Adblock</span>
    <label class="toggle">
      <input type="checkbox" id="antiAdblock">
      <span class="slider"></span>
    </label>
  </div>

  <div class="toggle-row">
    <span class="toggle-label">Mouse Unlock</span>
    <label class="toggle">
      <input type="checkbox" id="mouseUnlock">
      <span class="slider"></span>
    </label>
  </div>

  <div class="section-title">Filter lists</div>

  <div class="toggle-row">
    <span class="toggle-label">Use filter lists</span>
    <label class="toggle">
      <input type="checkbox" id="useFilterLists">
      <span class="slider"></span>
    </label>
  </div>

  <div class="filter-box">
    <div class="filter-stat" id="filterStat">Not built yet</div>
    <button class="whitelist-btn" id="rebuildBtn" style="margin-top:8px">Update filter lists</button>
  </div>

  <div class="section-title">YouTube</div>

  <div class="toggle-row">
    <span class="toggle-label">Skip video ads</span>
    <label class="toggle">
      <input type="checkbox" id="ytSkip">
      <span class="slider"></span>
    </label>
  </div>

  <div class="toggle-row">
    <span class="toggle-label">Hide ad slots</span>
    <label class="toggle">
      <input type="checkbox" id="ytHide">
      <span class="slider"></span>
    </label>
  </div>

  <div class="toggle-row">
    <span class="toggle-label" title="Cover the player so an ad is never seen or heard">Blackout during ads</span>
    <label class="toggle">
      <input type="checkbox" id="ytCurtain">
      <span class="slider"></span>
    </label>
  </div>

  <div class="section-title">Facebook</div>

  <div class="toggle-row">
    <span class="toggle-label">Sponsored posts</span>
    <label class="toggle">
      <input type="checkbox" id="fbSponsored">
      <span class="slider"></span>
    </label>
  </div>

  <div class="toggle-row">
    <span class="toggle-label">Sidebar ads</span>
    <label class="toggle">
      <input type="checkbox" id="fbSidebar">
      <span class="slider"></span>
    </label>
  </div>

  <div class="toggle-row">
    <span class="toggle-label">"Suggested for you"</span>
    <label class="toggle">
      <input type="checkbox" id="fbSuggested">
      <span class="slider"></span>
    </label>
  </div>

  <div class="toggle-row">
    <span class="toggle-label">Reels shelf</span>
    <label class="toggle">
      <input type="checkbox" id="fbReels">
      <span class="slider"></span>
    </label>
  </div>

  <div class="toggle-row">
    <span class="toggle-label" title="Outline ads in red instead of hiding them">Debug: outline only</span>
    <label class="toggle">
      <input type="checkbox" id="fbDebug">
      <span class="slider"></span>
    </label>
  </div>

  <div class="counter" id="counter">0 blocked</div>

  <button class="whitelist-btn" id="whitelistBtn">Whitelist this site</button>
  <div class="status" id="statusText">Checking...</div>

  <script src="popup.js"></script>
</body>
</html>
